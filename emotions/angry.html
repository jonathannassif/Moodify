<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feeling Angry</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6d6 0%, #fff5f5 100%);
        color: #333;
        transition: background 1s ease;
      }

      .container {
        text-align: center;
        max-width: 500px;
        padding: 2rem;
      }

      h1 {
        font-weight: 600;
        color: #b23a48;
        margin-bottom: 1.5rem;
      }

      .circle {
        width: 140px;
        height: 140px;
        margin: 2rem auto;
        border-radius: 50%;
        background: #ffb3b3;
        animation: breathe 4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
          background: #ffb3b3;
        }
        50% {
          transform: scale(1.4);
          background: #ff9999;
        }
      }

      .message {
        font-size: 1.1rem;
        color: #555;
        opacity: 0;
        transition: opacity 1s ease;
        min-height: 40px;
      }

      .message.show {
        opacity: 1;
      }

      button {
        margin-top: 2rem;
        padding: 0.7rem 1.5rem;
        background-color: #b23a48;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        background-color: #d94c57;
        transform: translateY(-2px);
      }

      .reflection {
        margin-top: 2rem;
        display: none;
        flex-direction: column;
        gap: 0.8rem;
      }

      textarea {
        width: 100%;
        padding: 0.7rem;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-family: inherit;
      }

      a.back {
        display: block;
        margin-top: 2rem;
        text-decoration: none;
        color: #555;
        font-weight: 500;
      }

      a.back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Let’s calm down together.</h1>
      <div class="circle"></div>
      <p class="message" id="message">Breathe in... Breathe out...</p>
      <button id="nextBtn">Next</button>

      <div class="reflection" id="reflection">
        <textarea
          id="note"
          placeholder="Write what made you angry (optional)"
        ></textarea>
        <button id="saveNote">Save Reflection</button>
      </div>

      <a href="../index.html" class="back">← Back</a>
    </div>

    <script>
      const messages = [
        "Breathe in... Breathe out...",
        "You’re in control of how you respond.",
        "Let that heat melt into calm.",
        "You’ve done well — now, reflect if you wish.",
      ];

      let index = 0;
      const msgEl = document.getElementById("message");
      const nextBtn = document.getElementById("nextBtn");
      const reflection = document.getElementById("reflection");

      nextBtn.addEventListener("click", () => {
        index++;
        if (index < messages.length) {
          msgEl.classList.remove("show");
          setTimeout(() => {
            msgEl.textContent = messages[index];
            msgEl.classList.add("show");
          }, 400);
        } else {
          msgEl.textContent = "Take a moment of stillness...";
          nextBtn.style.display = "none";
          reflection.style.display = "flex";
        }
      });

      // Reflection save (private)
      const saveNote = document.getElementById("saveNote");
      saveNote.addEventListener("click", () => {
        const text = document.getElementById("note").value.trim();
        if (text) {
          localStorage.setItem("angry_reflection", text);
          alert("Your reflection is saved locally.");
          document.getElementById("note").value = "";
        }
      });
    </script>
  </body>
</html>
